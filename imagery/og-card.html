<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#FAF7F2; font-family:Georgia, serif;
         display:flex; flex-direction:column; justify-content:center; padding:90px 100px; }
  .kick { font-family:system-ui,sans-serif; font-size:22px; letter-spacing:.16em;
          text-transform:uppercase; color:#7A2E1F; margin-bottom:34px; }
  h1 { font-size:64px; line-height:1.12; color:#1B1814; font-weight:500; max-width:980px; }
  h1 em { font-style:italic; color:#7A2E1F; }
  .rule { height:1px; background:#DDD6C8; margin:44px 0 30px; width:100%; }
  .meta { font-family:system-ui,sans-serif; font-size:24px; color:#75705F;
          display:flex; justify-content:space-between; }
  .mono { font-style:italic; font-size:30px; color:#1B1814; font-family:Georgia,serif; }
  .dot { color:#7A2E1F; }
</style></head><body>
  <div class="kick">SEO Content Writer</div>
  <h1>Content that ranks <em>and reads</em> like a human wrote it<span class="dot">.</span></h1>
  <div class="rule"></div>
  <div class="meta"><span class="mono">Shruti Gupta<span class="dot">.</span></span><span>SaaS · AI · Tech</span></div>
</body></html>
