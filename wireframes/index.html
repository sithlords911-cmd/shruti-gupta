<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframes — gray box</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f4f4; padding: 32px; }
  h1 { font-size: 18px; color: #2e2e2e; margin-bottom: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 32px; }
  .screen { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 13px; color: #5f5f5f; font-weight: 600; }
  .browser { width: 640px; border: 2px solid #2e2e2e; border-radius: 10px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  .chrome { height: 22px; background: #e3e3e3; border-bottom: 1px solid #bcbcbc; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .chrome i { width: 8px; height: 8px; border-radius: 50%; background: #bcbcbc; }
  .page { display: flex; flex-direction: column; }
  .mast { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid #bcbcbc; }
  .seal { width: 30px; height: 30px; border: 2px solid #5f5f5f; border-radius: 50%; }
  .nlinks { display: flex; gap: 18px; }
  .nl { width: 44px; height: 8px; background: #d4d4d4; border-radius: 4px; }
  .sect { padding: 34px 28px; border-bottom: 1px solid #e3e3e3; display: flex; flex-direction: column; gap: 14px; }
  .kick { width: 120px; height: 9px; background: #bcbcbc; border-radius: 4px; }
  .txt { height: 10px; background: #d4d4d4; border-radius: 5px; }
  .txt.sm { height: 8px; }
  .txt.lg { height: 20px; background: #bcbcbc; }
  .txt.xl { height: 34px; background: #bcbcbc; }
  .w20{width:20%}.w30{width:30%}.w40{width:40%}.w50{width:50%}.w60{width:60%}.w70{width:70%}.w80{width:80%}.w90{width:90%}.w100{width:100%}
  .btn { width: 140px; height: 36px; border: 2px solid #2e2e2e; border-radius: 18px; background: #d4d4d4; }
  .btn.ghost { background: #fff; }
  .row { display: flex; gap: 16px; align-items: center; }
  .row.top { align-items: flex-start; }
  .grow { flex: 1; }
  .card { border: 1.5px solid #bcbcbc; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 24px; min-width: 64px; border: 1.5px solid #bcbcbc; border-radius: 12px; padding: 0 12px; background: #f4f4f4; }
  .divider { height: 1px; background: #e3e3e3; }
  .imgbox { background: #e3e3e3; border: 1.5px dashed #bcbcbc; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; font-size: 11px; }
  .cols { display: grid; gap: 14px; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .foot { padding: 22px 28px; background: #ececec; display: flex; justify-content: space-between; align-items: center; }
  .phone { width: 300px; border: 2px solid #2e2e2e; border-radius: 24px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  .phone .bar { height: 24px; background: #e3e3e3; }
  .phone .sect { padding: 20px; }
</style>
</head>
<body>
<h1>SHRUTI GUPTA — portfolio · gray-box sheet (desktop pages + mobile home)</h1>
<div class="grid">

  <div class="screen"><div class="label">01 · Home</div><div class="browser"><div class="chrome"><i></i><i></i><i></i></div><div class="page">
    <div class="mast"><div class="seal"></div><div class="nlinks"><div class="nl"></div><div class="nl"></div><div class="nl"></div><div class="nl"></div></div></div>
    <div class="sect">
      <div class="kick"></div>
      <div class="txt xl w80"></div><div class="txt xl w60"></div>
      <div class="txt w70"></div><div class="txt w50"></div>
      <div class="row"><div class="btn"></div><div class="btn ghost"></div></div>
      <div class="row top"><div class="grow"></div><div class="imgbox" style="width:160px;height:190px">portrait</div></div>
    </div>
    <div class="sect" style="padding:18px 28px"><div class="row"><div class="txt sm w20"></div><div class="grow"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div></div></div>
    <div class="sect">
      <div class="kick"></div><div class="txt lg w40"></div>
      <div class="card row"><div class="grow"><div class="txt w60"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:60px"></div><div class="txt sm" style="width:80px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w70"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:60px"></div><div class="txt sm" style="width:80px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w50"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:60px"></div><div class="txt sm" style="width:80px"></div></div>
      <div class="btn ghost" style="width:170px"></div>
    </div>
    <div class="sect"><div class="kick"></div><div class="txt lg w50"></div>
      <div class="cols c4"><div class="card"><div class="txt w70"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div><div class="card"><div class="txt w70"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div></div>
    </div>
    <div class="sect"><div class="row top"><div class="imgbox" style="width:130px;height:150px">portrait</div><div class="grow" style="display:flex;flex-direction:column;gap:10px"><div class="kick"></div><div class="txt w90"></div><div class="txt w80"></div><div class="txt sm w60"></div></div></div></div>
    <div class="sect" style="align-items:flex-start"><div class="kick"></div><div class="txt lg w60"></div><div class="txt w50"></div><div class="btn"></div></div>
    <div class="foot"><div class="txt sm" style="width:120px"></div><div class="txt sm" style="width:160px"></div></div>
  </div></div></div>

  <div class="screen"><div class="label">02 · Work</div><div class="browser"><div class="chrome"><i></i><i></i><i></i></div><div class="page">
    <div class="mast"><div class="seal"></div><div class="nlinks"><div class="nl"></div><div class="nl"></div><div class="nl"></div><div class="nl"></div></div></div>
    <div class="sect">
      <div class="kick"></div><div class="txt xl w50"></div><div class="txt w60"></div>
      <div class="row"><div class="chip" style="min-width:90px"></div><div class="chip" style="min-width:90px"></div><div class="chip" style="min-width:90px"></div><div class="chip" style="min-width:90px"></div><div class="chip" style="min-width:60px"></div></div>
    </div>
    <div class="sect">
      <div class="kick"></div>
      <div class="card row"><div class="grow"><div class="txt w60"></div><div class="txt sm w45"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w70"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w55"></div><div class="txt sm w45"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="divider"></div>
      <div class="kick"></div>
      <div class="card row"><div class="grow"><div class="txt w65"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w50"></div><div class="txt sm w45"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="divider"></div>
      <div class="kick"></div>
      <div class="card row"><div class="grow"><div class="txt w60"></div><div class="txt sm w45"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w70"></div><div class="txt sm w40"></div></div><div class="txt sm" style="width:70px"></div><div class="txt sm" style="width:80px"></div><div class="txt sm" style="width:50px"></div></div>
    </div>
    <div class="sect" style="align-items:flex-start"><div class="txt lg w45"></div><div class="btn"></div></div>
    <div class="foot"><div class="txt sm" style="width:120px"></div><div class="txt sm" style="width:160px"></div></div>
  </div></div></div>

  <div class="screen"><div class="label">03 · About</div><div class="browser"><div class="chrome"><i></i><i></i><i></i></div><div class="page">
    <div class="mast"><div class="seal"></div><div class="nlinks"><div class="nl"></div><div class="nl"></div><div class="nl"></div><div class="nl"></div></div></div>
    <div class="sect">
      <div class="kick"></div>
      <div class="row top"><div class="grow" style="display:flex;flex-direction:column;gap:12px"><div class="txt xl w70"></div><div class="txt w90"></div><div class="txt w90"></div><div class="txt w80"></div><div class="txt w60"></div></div><div class="imgbox" style="width:190px;height:230px">portrait plate</div></div>
    </div>
    <div class="sect"><div class="kick"></div><div class="txt lg w40"></div>
      <div class="cols c3"><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div><div class="card"><div class="txt w70"></div><div class="txt sm w90"></div><div class="txt sm w85"></div></div><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div><div class="txt sm w80"></div></div></div>
    </div>
    <div class="sect"><div class="kick"></div><div class="txt lg w45"></div>
      <div class="row" style="flex-wrap:wrap"><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div><div class="chip"></div></div>
    </div>
    <div class="sect"><div class="kick"></div>
      <div class="card row"><div class="grow"><div class="txt w50"></div><div class="txt sm w60"></div></div><div class="txt sm" style="width:90px"></div></div>
      <div class="card row"><div class="grow"><div class="txt w55"></div><div class="txt sm w60"></div></div><div class="txt sm" style="width:90px"></div></div>
    </div>
    <div class="foot"><div class="txt sm" style="width:120px"></div><div class="txt sm" style="width:160px"></div></div>
  </div></div></div>

  <div class="screen"><div class="label">04 · Contact</div><div class="browser"><div class="chrome"><i></i><i></i><i></i></div><div class="page">
    <div class="mast"><div class="seal"></div><div class="nlinks"><div class="nl"></div><div class="nl"></div><div class="nl"></div><div class="nl"></div></div></div>
    <div class="sect" style="padding-top:60px;padding-bottom:60px">
      <div class="kick"></div>
      <div class="txt xl w70"></div><div class="txt xl w40"></div>
      <div class="txt w60"></div><div class="txt w50"></div>
      <div class="btn" style="width:200px;height:44px"></div>
      <div class="divider"></div>
      <div class="row"><div class="txt sm w30"></div><div class="grow"></div><div class="chip"></div><div class="chip"></div></div>
    </div>
    <div class="foot"><div class="txt sm" style="width:120px"></div><div class="txt sm" style="width:160px"></div></div>
  </div></div></div>

  <div class="screen"><div class="label">05 · Privacy</div><div class="browser"><div class="chrome"><i></i><i></i><i></i></div><div class="page">
    <div class="mast"><div class="seal"></div><div class="nlinks"><div class="nl"></div><div class="nl"></div><div class="nl"></div><div class="nl"></div></div></div>
    <div class="sect" style="padding-top:50px">
      <div class="kick"></div><div class="txt xl w40"></div>
      <div class="txt w90"></div><div class="txt w90"></div><div class="txt w80"></div>
      <div class="txt lg w30"></div>

    <div class="foot"><div class="txt sm" style="width:120px"></div><div class="txt sm" style="width:160px"></div></div>
  </div></div></div>

  <div class="screen"><div class="label">06 · Home — mobile</div><div class="phone"><div class="bar"></div><div class="page">
    <div class="mast" style="padding:12px 16px"><div class="seal" style="width:26px;height:26px"></div><div class="nl" style="width:34px"></div></div>
    <div class="sect">
      <div class="kick"></div>
      <div class="txt lg w90"></div><div class="txt lg w70"></div>
      <div class="txt w90"></div><div class="txt w70"></div>
      <div class="imgbox" style="width:100%;height:140px">portrait</div>
      <div class="btn" style="width:100%"></div>
    </div>
    <div class="sect"><div class="row"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div></div>
    <div class="sect"><div class="kick"></div><div class="txt lg w60"></div>
      <div class="card"><div class="txt w80"></div><div class="txt sm w50"></div><div class="row"><div class="txt sm" style="width:60px"></div><div class="txt sm" style="width:60px"></div></div></div>

    <div class="sect"><div class="kick"></div><div class="txt lg w70"></div><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div></div><div class="card"><div class="txt w60"></div><div class="txt sm w90"></div></div></div>
    <div class="sect"><div class="kick"></div><div class="txt w90"></div><div class="txt w80"></div><div class="btn" style="width:100%"></div></div>
    <div class="foot" style="padding:16px"><div class="txt sm" style="width:90px"></div><div class="txt sm" style="width:90px"></div></div>
  </div></div></div>

</div>
</body>
</html>
